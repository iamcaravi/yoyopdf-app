<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5f2" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="YOYOPDF privacy-first mobile PDF tools" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('yoyopdf.theme') || 'system';
          const dark = saved === 'dark' || (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.themePreference = saved;
        } catch (_) {}
      })();
    </script>
    <title>YOYOPDF</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>YOYOPDF requires JavaScript to run.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
